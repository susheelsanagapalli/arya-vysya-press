name: Deploy Main, Beta and Beta-Enhanced to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
      - beta-enhanced
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Pages artifact (main at /, beta at /beta, beta-enhanced at /beta-enhanced)
        run: |
          rm -rf _site
          mkdir -p _site _site/beta _site/beta-enhanced

          git fetch origin main beta beta-enhanced

          git archive origin/main | tar -x -C _site
          git archive origin/beta | tar -x -C _site/beta
          git archive origin/beta-enhanced | tar -x -C _site/beta-enhanced

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
